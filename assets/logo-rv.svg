<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Monograma RV neon azul e roxo com órbitas luminosas">
  <defs>
    <radialGradient id="bg" cx="48%" cy="38%" r="70%"><stop stop-color="#171c35"/><stop offset="1" stop-color="#08090d"/></radialGradient>
    <linearGradient id="front" x1="140" y1="130" x2="380" y2="365"><stop stop-color="#a7dfff"/><stop offset=".48" stop-color="#8395ff"/><stop offset="1" stop-color="#d1a4ff"/></linearGradient>
    <filter id="blueNeon" x="-80%" y="-60%" width="260%" height="220%"><feGaussianBlur stdDeviation="7" result="wide"/><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/><feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="purpleNeon" x="-80%" y="-60%" width="260%" height="220%"><feGaussianBlur stdDeviation="7" result="wide"/><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/><feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="frontGlow" x="-70%" y="-60%" width="240%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .front-mark{fill:none;stroke-width:3;stroke-linejoin:round;font-family:Arial,Helvetica,sans-serif;font-size:142px;font-weight:700;letter-spacing:-13px}
    .neon-letter{opacity:.15;animation:flicker 4.8s ease-in-out infinite}
    .neon-r{stroke:#55baff;filter:url(#blueNeon)}
    .neon-v{stroke:#b66aff;filter:url(#purpleNeon);animation-delay:-2.35s;animation-duration:5.4s}
    @keyframes flicker{0%,100%{opacity:.12}9%{opacity:.22}17%{opacity:.78}23%{opacity:.56}31%{opacity:.9}38%{opacity:.25}53%{opacity:.18}66%{opacity:.72}74%{opacity:.48}84%{opacity:.16}92%{opacity:.83}}
    .orbit{transform-origin:256px 256px;animation:spin 14s linear infinite}
    .orbit.slow{animation-duration:20s;animation-direction:reverse}
    .dot{animation:pulse 1.8s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{to{opacity:.48}}
    @media(prefers-reduced-motion:reduce){.neon-letter{animation:none;opacity:.65}.orbit,.dot{animation:none}}
  </style>
  <circle cx="256" cy="256" r="252" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#8d9bff" stroke-opacity=".2" stroke-width="2"/>

  <!-- Linhas e pontos orbitais aproveitados da variação 03. -->
  <ellipse class="orbit" cx="256" cy="256" rx="166" ry="88" fill="none" stroke="#438bff" stroke-opacity=".22" stroke-width="1.4"/>
  <ellipse class="orbit slow" cx="256" cy="256" rx="186" ry="63" fill="none" stroke="#9c67ed" stroke-opacity=".2" stroke-width="1.3"/>
  <circle class="orbit" cx="422" cy="256" r="5" fill="#70c8ff" filter="url(#glow)"/>
  <circle class="orbit slow" cx="442" cy="256" r="4" fill="#c18aff" filter="url(#glow)"/>
  <circle class="dot" cx="256" cy="91" r="2.5" fill="#70c8ff" filter="url(#glow)"/>

  <path d="M126 155v-28h84M302 127h84v28M126 357v28h84M302 385h84v-28" fill="none" stroke="#818eff" stroke-linecap="round" stroke-width="5" opacity=".55"/>
  <text class="front-mark" x="256" y="285" text-anchor="middle" filter="url(#frontGlow)"><tspan class="neon-letter neon-r">R</tspan><tspan class="neon-letter neon-v">V</tspan></text>
</svg>
